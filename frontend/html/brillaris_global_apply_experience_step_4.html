<style>
        /* Custom utilities for dark mode inputs */
        input[type="month"] {
            color-scheme: dark;
        }
        /* Custom scrollbar to match theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #092e2a; }
        ::-webkit-scrollbar-thumb { background: #164f48; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f8f78; }
        
        /* Remove default input styling for the editorial look */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
            -webkit-text-fill-color: #e3e3de;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-primary-container text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-tertiary selection:text-primary-container relative overflow-x-hidden">
<!-- Atmospheric background glow -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-[1000px] h-[500px] bg-secondary-container/20 blur-[120px] rounded-full"></div>
</div>
<!-- Application specific minimal header (Global Nav suppressed due to transactional nature) -->
<header class="w-full py-8 px-margin-mobile md:px-margin-desktop border-b border-on-primary-container/15 flex justify-center items-center relative z-10 bg-primary-container/80 backdrop-blur-md">
<h1 class="font-display-lg-mobile text-headline-sm md:font-display-lg md:text-headline-md text-tertiary tracking-tight">Brillaris Global</h1>
</header>
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-16 md:py-24 flex flex-col relative z-10">
<!-- Progress Indicator -->
<div class="w-full max-w-4xl mx-auto flex items-center justify-between relative mb-16 px-4 md:px-0">
<!-- Connecting Line -->
<div class="absolute left-8 right-8 top-1/2 -translate-y-1/2 h-[1px] bg-outline-variant/30 z-0"></div>
<div class="absolute left-8 right-1/4 top-1/2 -translate-y-1/2 h-[1px] bg-tertiary/50 z-0"></div> <!-- Active track -->
<!-- Step 1 -->
<div class="relative z-10 flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container border border-tertiary flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Identity</span>
</div>
<!-- Step 2 -->
<div class="relative z-10 flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container border border-tertiary flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Credentials</span>
</div>
<!-- Step 3 -->
<div class="relative z-10 flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container border border-tertiary flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden md:block">Philosophy</span>
</div>
<!-- Step 4 (Active) -->
<div class="relative z-10 flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-tertiary flex items-center justify-center text-primary-container font-label-caps text-label-caps shadow-[0_0_20px_rgba(228,194,133,0.25)] ring-4 ring-primary-container">
                    04
                </div>
<span class="font-label-caps text-label-caps text-tertiary hidden md:block tracking-widest uppercase">Experience</span>
</div>
<!-- Step 5 -->
<div class="relative z-10 flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-outline-variant font-label-caps text-label-caps">
                    05
                </div>
<span class="font-label-caps text-label-caps text-outline-variant hidden md:block">Review</span>
</div>
</div>
<!-- Headline & Context -->
<div class="max-w-4xl mx-auto w-full text-center mb-16">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-6">Professional Experience</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Detail your strategic impact and global leadership tenure. Provide entries in reverse chronological order.</p>
</div>
<!-- Experience Canvas -->
<div class="max-w-4xl mx-auto w-full flex flex-col gap-8">
<!-- Experience Block 01 -->
<div class="bg-secondary-container/20 border border-on-primary-container/15 p-8 md:p-12 relative group backdrop-blur-sm">
<!-- Architectural Accent Line -->
<div class="absolute left-0 top-0 bottom-0 w-[2px] bg-tertiary opacity-70 group-hover:opacity-100 transition-opacity duration-500 shadow-[0_0_10px_rgba(228,194,133,0.5)]"></div>
<div class="flex justify-between items-start mb-10 border-b border-on-primary-container/10 pb-6">
<h3 class="font-headline-sm text-headline-sm text-tertiary flex items-center gap-3">
<span class="font-label-caps text-label-caps text-tertiary/60 tracking-widest">ENTRY</span>
                        01
                    </h3>
<button class="text-on-surface-variant hover:text-error transition-colors flex items-center gap-2 group/btn" type="button">
<span class="font-label-caps text-label-caps hidden md:inline-block tracking-wider group-hover/btn:text-error transition-colors">REMOVE</span>
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-x-gutter gap-y-12">
<!-- Organization -->
<div class="col-span-1 md:col-span-6 relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 tracking-widest">Organization</label>
<input class="w-full bg-transparent border-0 border-b border-on-surface-variant/50 focus:border-tertiary focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-surface-variant transition-colors" placeholder="Institution Name" type="text" value="Global Executive Network"/>
</div>
<!-- Role -->
<div class="col-span-1 md:col-span-6 relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 tracking-widest">Role / Title</label>
<input class="w-full bg-transparent border-0 border-b border-on-surface-variant/50 focus:border-tertiary focus:ring-0 px-0 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-surface-variant transition-colors" placeholder="Official Title" type="text" value="Managing Director, EMEA"/>
</div>
<!-- Start Date -->
<div class="col-span-1 md:col-span-3 relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 tracking-widest">Start Date</label>
<input class="w-full bg-transparent border-0 border-b border-on-surface-variant/50 focus:border-tertiary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors cursor-pointer" type="month" value="2019-03"/>
</div>
<!-- End Date -->
<div class="col-span-1 md:col-span-3 relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3 tracking-widest">End Date</label>
<input class="w-full bg-transparent border-0 border-b border-on-surface-variant/50 focus:border-tertiary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors cursor-pointer text-on-surface-variant" placeholder="Present" type="month"/>
</div>
<!-- Current Role Checkbox -->
<div class="col-span-1 md:col-span-6 flex items-end pb-3">
<label class="flex items-center gap-4 cursor-pointer group/check">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 border border-on-surface-variant rounded-sm peer-checked:bg-tertiary peer-checked:border-tertiary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover/check:text-on-surface transition-colors">I currently work here</span>
</label>
</div>
<!-- Responsibilities -->
<div class="col-span-1 md:col-span-12 relative mt-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-4 tracking-widest">Key Responsibilities &amp; Impact</label>
<div class="relative">
<!-- Subtle Jade connection line for architectural depth -->
<div class="absolute -left-4 top-0 bottom-0 w-[1px] bg-on-primary-container/20"></div>
<textarea class="w-full bg-transparent border-0 border-b border-on-surface-variant/50 focus:border-tertiary focus:ring-0 px-0 py-2 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 transition-colors resize-y leading-relaxed" placeholder="Describe your strategic contributions..." rows="5">Spearheaded market expansion strategy leading to a 45% increase in regional AUM. Directed a cross-functional team of 120 professionals across 5 international offices. Orchestrated the acquisition and integration of a key regional competitor, consolidating market dominance in the European sector.</textarea>
</div>
</div>
</div>
</div>
<!-- Add Button (Champagne Gold Restrained Luxury) -->
<button class="w-full py-8 border border-tertiary/20 bg-gradient-to-b from-transparent to-tertiary/[0.02] hover:bg-tertiary/[0.05] hover:border-tertiary/40 text-tertiary flex items-center justify-center gap-3 transition-all duration-300 group" type="button">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-300 font-light">add</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Add Another Experience</span>
</button>
</div>
<!-- Navigation Footer -->
<div class="max-w-4xl mx-auto w-full mt-24 pt-10 border-t border-on-primary-container/15 flex flex-col-reverse md:flex-row justify-between items-center gap-6">
<!-- Secondary Action -->
<button class="w-full md:w-auto px-8 py-4 border border-on-primary-container/40 text-on-surface hover:bg-secondary-container/20 hover:border-on-primary-container font-label-caps text-label-caps tracking-widest uppercase transition-all duration-300 flex items-center justify-center gap-3 group" type="button">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Previous Step
            </button>
<!-- Primary Action -->
<button class="w-full md:w-auto px-12 py-4 bg-tertiary text-primary-container hover:bg-tertiary-fixed font-label-caps text-label-caps tracking-widest uppercase transition-all duration-300 flex items-center justify-center gap-3 group relative overflow-hidden shadow-[0_0_0_rgba(228,194,133,0)] hover:shadow-[0_0_25px_rgba(228,194,133,0.2)]" type="button">
<span class="relative z-10 flex items-center gap-3">
                    Save &amp; Continue
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<!-- Subtle internal shine effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] skew-x-12 z-0"></div>
</button>
</div>
</main>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
