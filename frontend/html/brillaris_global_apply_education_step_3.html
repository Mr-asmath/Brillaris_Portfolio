<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Brillaris Global - Step 03 Education</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    },
                    "borderRadius": {

                    "spacing": {

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-tertiary selection:text-tertiary-container">
<!-- TopNavBar (Linear/Transactional Intent - Suppressed, using minimal header instead) -->
<header class="w-full py-8 px-margin-mobile md:px-margin-desktop border-b border-outline-variant/15 sticky top-0 bg-surface/80 backdrop-blur-md z-40">
<div class="max-w-container-max mx-auto flex justify-between items-center">
<span class="font-display-lg text-headline-sm text-tertiary">Brillaris Global</span>
<div class="text-on-surface-variant font-label-caps text-label-caps">Application Status: In Progress</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center py-20 px-margin-mobile md:px-margin-desktop">
<div class="max-w-3xl w-full">
<!-- Progress Indicator -->
<div class="mb-16">
<div class="flex justify-between items-center relative">
<!-- Connecting Lines -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[1px] bg-outline-variant/30 -z-10"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-[1px] bg-tertiary -z-10"></div>
<!-- Steps -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container border border-tertiary flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden sm:block">Personal</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container border border-tertiary flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant hidden sm:block">Experience</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-tertiary border border-tertiary flex items-center justify-center text-tertiary-container shadow-[0_0_15px_rgba(228,194,133,0.3)]">
<span class="font-label-caps text-[14px]">03</span>
</div>
<span class="font-label-caps text-label-caps text-tertiary hidden sm:block">Education</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-outline-variant">
<span class="font-label-caps text-[14px]">04</span>
</div>
<span class="font-label-caps text-label-caps text-outline-variant hidden sm:block">Review</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="bg-primary-container border border-secondary-container/30 rounded-xl p-8 md:p-12 relative overflow-hidden">
<!-- Decorative network pattern bg -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #4F8F78 1px, transparent 0); background-size: 32px 32px;"></div>
<h1 class="font-display-lg text-headline-md md:text-display-lg-mobile text-on-surface mb-2 relative z-10">Academic Background</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 relative z-10">Detail your highest level of formal education to support your application for this executive role.</p>
<form class="space-y-8 relative z-10">
<!-- Highest Degree -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-secondary" for="degree">Highest Degree Achieved</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-b border-t-0 border-x-0 border-inverse-surface/30 focus:border-tertiary focus:ring-0 text-on-surface py-4 px-0 bg-transparent appearance-none" id="degree">
<option class="text-outline" disabled="" selected="" value="">Select your degree</option>
<option class="bg-surface-container text-on-surface" value="doctorate">Doctorate (Ph.D., Ed.D., etc.)</option>
<option class="bg-surface-container text-on-surface" value="masters">Master's Degree (MBA, MS, MA, etc.)</option>
<option class="bg-surface-container text-on-surface" value="bachelors">Bachelor's Degree (BS, BA, etc.)</option>
<option class="bg-surface-container text-on-surface" value="other">Other Professional Certification</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Institution Name -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-secondary" for="institution">Institution Name</label>
<input class="w-full bg-surface-container-lowest border-b border-t-0 border-x-0 border-inverse-surface/30 focus:border-tertiary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline-variant transition-colors" id="institution" placeholder="e.g. London School of Economics" type="text"/>
</div>
<!-- Graduation Year -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-secondary" for="graduation_year">Graduation Year</label>
<input class="w-full md:w-1/3 bg-surface-container-lowest border-b border-t-0 border-x-0 border-inverse-surface/30 focus:border-tertiary focus:ring-0 text-on-surface py-4 px-0 placeholder:text-outline-variant transition-colors" id="graduation_year" max="2030" min="1950" placeholder="YYYY" type="number"/>
</div>
<!-- Actions -->
<div class="pt-12 flex flex-col-reverse md:flex-row justify-between items-center gap-6 border-t border-outline-variant/15 mt-12">
<button class="w-full md:w-auto px-8 py-4 border border-secondary text-inverse-surface hover:bg-secondary/10 transition-colors flex items-center justify-center gap-2 font-label-caps text-label-caps group" type="button">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                            Previous Step
                        </button>
<button class="w-full md:w-auto px-8 py-4 bg-tertiary text-primary-container hover:bg-tertiary-fixed transition-colors flex items-center justify-center gap-2 font-label-caps text-label-caps group shadow-[0_0_20px_rgba(228,194,133,0.15)] hover:shadow-[0_0_25px_rgba(228,194,133,0.3)]" type="submit">
                            Save &amp; Continue
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</main>
<!-- Footer (Suppressed for transactional flow, keeping a minimal functional footer if needed, but per instructions, linear flow -> suppress shell. Omitting standard footer) -->
</body></html>
